<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11151c">
    <title>FPV Race Results</title>
    <link rel="stylesheet" href="/style.css">
    <!-- データ層 (FPVTrackside Webb 由来) -->
    <script src="/httpfiles/Accessor.js"></script>
    <script src="/httpfiles/EventManager.js"></script>
    <script src="/httpfiles/BundleAccessor.js"></script>
</head>
<body>
    <header class="appbar">
        <div class="appbar-inner">
            <a class="home-link" href="/" title="Event list">≡</a>
            <div class="titles">
                <span id="eventName" class="event-name">&nbsp;</span>
                <span id="eventMeta" class="event-meta"></span>
            </div>
        </div>
    </header>

    <div class="toolbar">
        <button id="expandAll" type="button" class="tool-btn">Expand all</button>
        <button id="collapseAll" type="button" class="tool-btn">Collapse all</button>
    </div>

    <main id="app" class="app">
        <div class="loading">Loading…</div>
    </main>

    <footer class="appfoot">
        <span id="updated"></span>
    </footer>

    <script>
        // 全データを 1 ファイルに集約した bundle を 1 回だけ取得する。
        // BASE はイベントごとに web-export が "/<slug>/" へ置換 (絶対パスなので
        // 末尾スラッシュの有無に依存せず正しく解決される)。
        const BASE = "%BASE%";
        const BUNDLE_URL = BASE + "data/bundle.json";
        const VERSION_URL = BASE + "data/version.json";
        const TOO_OLD = 100000;
    </script>
    <script src="/app.js"></script>
</body>
</html>
